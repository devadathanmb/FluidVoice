name: Personal macOS DMG

on:
  workflow_dispatch:
    inputs:
      run_tests:
        # Tests add a full Debug build (~13 min). Run them locally before pushing instead.
        description: Also run the test suite (adds a Debug build, ~13 min)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build tested ARM64 DMG
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout selected revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Show Xcode version
        run: xcodebuild -version

      # Xcode ships the Metal compiler as a separate component; the app compiles .metal shaders.
      - name: Install Metal Toolchain
        run: |
          xcodebuild -downloadComponent MetalToolchain
          xcrun metal --version

      - name: Cache Swift package checkouts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Fluid.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Resolve Swift package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Fluid.xcodeproj \
            -scheme Fluid \
            -derivedDataPath "$RUNNER_TEMP/DerivedData"

      # Tests/ci-skipped-tests.txt holds the hosted exclusions, including the
      # nondeterministic Tiny Whisper E2E. Those tests stay runnable locally.
      - name: Run tests (excluding Tests/ci-skipped-tests.txt)
        if: ${{ inputs.run_tests }}
        run: |
          skip_args=()
          while IFS= read -r test_id; do
            skip_args+=("-skip-testing:$test_id")
          done < <(grep -Ev '^[[:space:]]*(#|$)' Tests/ci-skipped-tests.txt)
          xcodebuild test \
            -project Fluid.xcodeproj \
            -scheme Fluid \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -disableAutomaticPackageResolution \
            "${skip_args[@]}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Build release app
        run: |
          xcodebuild build \
            -project Fluid.xcodeproj \
            -scheme Fluid \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -disableAutomaticPackageResolution \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create DMG
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release/FluidVoice.app"
          STAGING_DIR="$RUNNER_TEMP/dmg-root"
          DMG_PATH="$RUNNER_TEMP/FluidVoice-freedom-arm64.dmg"

          test -d "$APP_PATH"
          mkdir -p "$STAGING_DIR"
          ditto "$APP_PATH" "$STAGING_DIR/FluidVoice.app"
          ln -s /Applications "$STAGING_DIR/Applications"
          hdiutil create \
            -volname "FluidVoice" \
            -srcfolder "$STAGING_DIR" \
            -format UDZO \
            -ov \
            "$DMG_PATH"

      - name: Upload DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: FluidVoice-freedom-arm64-dmg
          path: ${{ runner.temp }}/FluidVoice-freedom-arm64.dmg
          if-no-files-found: error
          retention-days: 30
